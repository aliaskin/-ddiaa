<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sistem Kupon</title>
  <meta name="description" content="iddaa bülteninden günlük 3-4-5-6 sistem kuponu oluşturan maç analiz uygulaması">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sistem Kupon">
  <link rel="stylesheet" href="css/app.css?v=6">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-ticket" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M4 6.5h16v3a2.5 2.5 0 0 0 0 5v3H4v-3a2.5 2.5 0 0 0 0-5z"/><path stroke="currentColor" stroke-width="1.8" stroke-dasharray="2 2.2" d="M14.5 7v10"/></symbol>
      <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="currentColor" d="m12 8.2 3.1 2.2-1.2 3.6h-3.8l-1.2-3.6z"/><path fill="none" stroke="currentColor" stroke-width="1.4" d="M12 8.2V4M15.1 10.4l3.8-1.3M13.9 14l2.4 3.3M10.1 14l-2.4 3.3M8.9 10.4 5.1 9.1"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v3.2h3.2M12 8v4.4l2.8 1.8"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M10.3 3.5h3.4l.5 2.4 1.6.9 2.3-.8 1.7 2.9-1.8 1.6v1.9l1.8 1.6-1.7 2.9-2.3-.8-1.6.9-.5 2.4h-3.4l-.5-2.4-1.6-.9-2.3.8L4.2 16l1.8-1.6v-1.9L4.2 11l1.7-2.9 2.3.8 1.6-.9z"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M19.5 12a7.5 7.5 0 1 1-2.4-5.5M19.5 4v4h-4"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5.5" y="10.5" width="13" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></symbol>
      <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5.5" y="10.5" width="13" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="M8.5 10.5V8a3.5 3.5 0 0 1 6.8-1.2"/></symbol>
      <symbol id="i-swap" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 8.5h12.5l-3-3M19 15.5H6.5l3 3"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="m7 7 10 10M17 7 7 17"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M12 6v12M6 12h12"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 11v5.5M12 7.6v.1"/></symbol>
      <symbol id="i-ext" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M13.5 5.5h5v5M18.5 5.5l-7.5 7.5M16.5 13.5v4a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 17.5V9.5A1.5 1.5 0 0 1 7 8h4"/></symbol>
    </defs>
  </svg>

  <header class="top">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <div>
        <h1>Sistem Kupon</h1>
        <p id="status" class="status">Yükleniyor…</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-refresh" aria-label="Verileri yenile"><svg><use href="#i-refresh"/></svg></button>
      <button class="icon-btn" id="btn-settings" aria-label="Ayarlar"><svg><use href="#i-gear"/></svg></button>
    </div>
    <div id="progress" class="progress" hidden><span></span></div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Bölümler">
    <button data-tab="kupon" class="active"><svg><use href="#i-ticket"/></svg><span>Kupon</span></button>
    <button data-tab="maclar"><svg><use href="#i-ball"/></svg><span>Maçlar</span></button>
    <button data-tab="oran"><svg><use href="#i-target"/></svg><span>10 Oran</span></button>
    <button data-tab="gecmis"><svg><use href="#i-history"/></svg><span>Geçmiş</span></button>
  </nav>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle"></div>
    <div id="sheet-body" class="sheet-body"></div>
  </section>
  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/app.js?v=6"></script>
</body>
</html>
